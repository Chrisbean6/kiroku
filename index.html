<div id="app" class="boot">
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <div><h1 class="logo" data-text="Kiroku">Kiroku</h1>
        <div class="brand-sub"><span id="syncState">la tua libreria</span></div></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnPick" aria-label="Cosa inizio? Scelta a caso" title="Cosa inizio?"><svg class="ic"><use href="#i-dice"/></svg></button>
        <button class="icon-btn" id="btnSettings" aria-label="Impostazioni, temi e backup" title="Impostazioni"><svg class="ic"><use href="#i-sliders"/></svg></button>
      </div>
    </div>
    <button class="emblem" id="emblem" aria-label="Kuro, il gatto di Kiroku"></button>
    <div class="wrap">
      <div class="summary" id="summary" aria-live="polite"></div>
      <div id="banner"></div>
    </div>
  </header>

  <div class="typetabs-wrap">
    <div class="typetabs" id="typetabs" role="group" aria-label="Categoria"></div>
  </div>

  <main class="wrap" id="main">
    <section data-view="scaffale">
      <div class="toolbar">
        <label class="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <span class="sr-only">Cerca</span>
          <input id="q" type="search" placeholder="Cerca" autocomplete="off" enterkeyhint="search">
        </label>
        <label class="select-pill">
          <span class="sr-only">Ordina per</span>
          <select id="sort">
            <option value="recent">Ultimi aggiunti</option>
            <option value="score">Voto</option>
            <option value="title">Titolo A-Z</option>
            <option value="finished">Finiti di recente</option>
            <option value="year">Anno di uscita</option>
          </select>
        </label>
        <button class="icon-btn" id="btnView" aria-label="Cambia vista"><svg class="ic"><use href="#i-list"/></svg></button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtra per stato"></div>
      <div id="shelf"></div>
    </section>

    <section data-view="tier" hidden>
      <div class="view-head"><h2>Tier list</h2><p>Si compone da sola con i tuoi voti. Tocca una copertina per aprirla.</p></div>
      <div id="tiers"></div>
    </section>

    <section data-view="stats" hidden>
      <div class="view-head"><h2>Statistiche</h2><p id="statsSub">Quanto hai letto, visto, giocato e ascoltato.</p></div>
      <div id="stats"></div>
    </section>

    <section data-view="consigli" hidden>
      <div class="view-head"><h2>Per te</h2><p>Titoli nuovi scelti in base a quello che hai votato bene.</p></div>
      <div id="recsBox"></div>
    </section>
  </main>

  <nav class="nav" aria-label="Sezioni">
    <span class="nav-ind" aria-hidden="true"></span>
    <a href="#scaffale" data-v="scaffale" aria-current="page"><svg class="ic"><use href="#i-shelf"/></svg>Scaffale</a>
    <a href="#tier" data-v="tier"><svg class="ic"><use href="#i-tier"/></svg>Tier list</a>
    <a href="#stats" data-v="stats"><svg class="ic"><use href="#i-chart"/></svg>Statistiche</a>
    <a href="#consigli" data-v="consigli"><svg class="ic"><use href="#i-sparkle"/></svg>Per te</a>
  </nav>
  <button class="fab" id="fab" aria-label="Aggiungi" aria-expanded="false"><svg class="ic"><use href="#i-plus"/></svg></button>
</div>

<div id="gate" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="vendor/supabase.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
